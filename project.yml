name: FinancePlanner
options:
  bundleIdPrefix: com.student.financeplanner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
settings:
  SWIFT_VERSION: "5.0"
  SWIFT_STRICT_CONCURRENCY: "minimal"
targets:
  FinancePlanner:
    type: application
    platform: iOS
    sources: 
      - path: FinancePlanner
    settings:
      SWIFT_VERSION: "5.0"
      SWIFT_STRICT_CONCURRENCY: "minimal"
    info:
      path: FinancePlanner/Info.plist
      properties:
        CFBundleDisplayName: "FinancePlan"
        CFBundleIdentifier: com.student.financeplanner
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
