name: Build for Appetize.io

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect and Fix Structure
        run: |
          echo "=== Root files ==="
          ls -la

          # Если папки FinancePlanner нет, но swift-файлы лежат в корне, перемещаем их в FinancePlanner
          if [ ! -d "FinancePlanner" ]; then
            echo "FinancePlanner directory missing. Creating and organizing files..."
            mkdir -p FinancePlanner
            
            # Перемещаем директории проекта, если они оказались в корне
            for dir in Models Views ViewModels Services Resources; do
              if [ -d "$dir" ]; then
                mv "$dir" FinancePlanner/
              fi
            done
            
            # Перемещаем файлы исходного кода и Info.plist, если они в корне
            for file in *.swift Info.plist; do
              if [ -f "$file" ]; then
                mv "$file" FinancePlanner/
              fi
            done
          fi

          echo "=== Content of FinancePlanner ==="
          ls -la FinancePlanner

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild clean build \
            -project FinancePlanner.xcodeproj \
            -scheme FinancePlanner \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Compress App Bundle for Appetize.io
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphonesimulator -name "FinancePlanner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: FinancePlanner.app not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r -X "${GITHUB_WORKSPACE}/FinancePlanner-Simulator.zip" "FinancePlanner.app"

      - name: Upload Appetize Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appetize-build
          path: FinancePlanner-Simulator.zip
          retention-days: 14
